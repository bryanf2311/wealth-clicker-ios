name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Find Workspace
        id: find_workspace
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Workspace not found!"
            exit 1
          fi
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "Found workspace at: $WORKSPACE"

      - name: Build iOS Archive (No Signing)
        run: |
          xcodebuild -workspace ${{ steps.find_workspace.outputs.workspace }} \
            -scheme App \
            -configuration Release \
            -archivePath App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-archive
          path: |
            App.xcarchive
