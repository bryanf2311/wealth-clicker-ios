<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wealth Clicker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #fbbf24;
            --success-color: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --sale-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 1rem 0 2rem;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
        }

        #game-container {
            text-align: center;
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        #money-icon {
            font-size: 90px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.3));
        }

        #money-icon:active {
            transform: scale(0.85) rotate(-5deg);
        }

        #score-container {
            font-size: 2.6rem;
            margin: 1rem 0;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        #stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 0.75rem 1rem;
            border-radius: 1rem;
        }

        #sale-banner {
            display: none;
            background: var(--sale-color);
            color: white;
            padding: 6px 12px;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .shop {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }

        .upgrade-btn {
            padding: 0.8rem 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1rem;
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            text-align: center;
        }

        .upgrade-btn:not(:disabled) {
            border-color: rgba(251, 191, 36, 0.35);
            box-shadow: inset 0 0 14px rgba(251, 191, 36, 0.07);
        }

        .upgrade-btn:active:not(:disabled) {
            transform: scale(0.94);
        }

        .upgrade-btn:disabled {
            opacity: 0.45;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        .upgrade-icon {
            font-size: 1.5rem;
            line-height: 1.1;
        }

        .upgrade-name {
            font-weight: 700;
            font-size: 0.8rem;
        }

        .upgrade-subtext {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .upgrade-bottom {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.25rem;
        }

        .upgrade-cost {
            font-weight: 700;
            color: var(--accent-color);
            font-family: monospace;
            font-size: 0.85rem;
        }

        .upgrade-count {
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-color);
            padding: 2px 7px;
            border-radius: 1rem;
            display: none;
        }

        .sale-text {
            color: var(--sale-color);
            animation: flash 0.5s infinite alternate;
        }

        @keyframes flash {
            from { opacity: 1; }
            to { opacity: 0.6; }
        }

        /* Floating Text Effect */
        .floating-text {
            position: absolute;
            pointer-events: none;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.5rem;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        /* Settings UI */
        #settings-toggle {
            margin-top: 1.5rem;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            width: 100%;
        }

        #settings-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 20;
            border-radius: 2rem;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 2rem;
            border-radius: 1.5rem;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .settings-row {
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .settings-row label {
            font-weight: 600;
            color: var(--text-muted);
        }

        .settings-row input[type="range"] {
            width: 60%;
            accent-color: var(--accent-color);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(18px); }

        #close-settings {
            margin-top: 2rem;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="settings-modal">
            <div class="modal-content">
                <h2 style="margin-top:0">Settings</h2>

                <div class="settings-row">
                    <label>Sound</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="settings-row">
                    <label>Music</label>
                    <input type="range" id="music-volume" min="0" max="1" step="0.1" value="0.3">
                </div>

                <div class="settings-row">
                    <label>SFX</label>
                    <input type="range" id="sfx-volume" min="0" max="1" step="0.1" value="0.7">
                </div>

                <button id="close-settings">Close</button>
            </div>
        </div>

        <div id="sale-banner">🔥 50% OFF! (<span id="sale-timer">0</span>s) 🔥</div>
        
        <div id="score-container">$<span id="money">0</span></div>
        
        <div id="stats">
            <div><span style="color: var(--text-muted)">/sec:</span> <span id="mps-display">0</span></div>
            <div><span style="color: var(--text-muted)">/click:</span> <span id="mpc-display">1</span></div>
            <div style="text-align: right;"><span style="color: var(--text-muted)">Mult:</span> <span id="prestige-mult-display">x1.0</span></div>
        </div>

        <div id="money-icon">💰</div>

        <div class="shop">
            <button class="upgrade-btn" id="upgrade-training">
                <span class="upgrade-icon">🎓</span>
                <span class="upgrade-name">Training</span>
                <span class="upgrade-subtext">+$1/click</span>
                <span class="upgrade-bottom"><span class="upgrade-cost">$15</span><span class="upgrade-count">x0</span></span>
            </button>
            <button class="upgrade-btn" id="upgrade-worker">
                <span class="upgrade-icon">👷</span>
                <span class="upgrade-name">Worker</span>
                <span class="upgrade-subtext">+$1/sec</span>
                <span class="upgrade-bottom"><span class="upgrade-cost">$100</span><span class="upgrade-count">x0</span></span>
            </button>
            <button class="upgrade-btn" id="upgrade-manager">
                <span class="upgrade-icon">💼</span>
                <span class="upgrade-name">Manager</span>
                <span class="upgrade-subtext">+$5/sec</span>
                <span class="upgrade-bottom"><span class="upgrade-cost">$500</span><span class="upgrade-count">x0</span></span>
            </button>
            <button class="upgrade-btn" id="upgrade-bank">
                <span class="upgrade-icon">🏦</span>
                <span class="upgrade-name">Bank</span>
                <span class="upgrade-subtext">+$25/sec</span>
                <span class="upgrade-bottom"><span class="upgrade-cost">$2500</span><span class="upgrade-count">x0</span></span>
            </button>
            <button class="upgrade-btn" id="upgrade-real_estate">
                <span class="upgrade-icon">🏙️</span>
                <span class="upgrade-name">Real Estate</span>
                <span class="upgrade-subtext">+$100/sec</span>
                <span class="upgrade-bottom"><span class="upgrade-cost">$15000</span><span class="upgrade-count">x0</span></span>
            </button>
            <button class="upgrade-btn" id="upgrade-hedge_fund">
                <span class="upgrade-icon">📈</span>
                <span class="upgrade-name">Hedge Fund</span>
                <span class="upgrade-subtext">+$500/sec</span>
                <span class="upgrade-bottom"><span class="upgrade-cost">$100000</span><span class="upgrade-count">x0</span></span>
            </button>
            <button class="upgrade-btn" id="upgrade-monopoly">
                <span class="upgrade-icon">👑</span>
                <span class="upgrade-name">Monopoly</span>
                <span class="upgrade-subtext">+$5000/sec</span>
                <span class="upgrade-bottom"><span class="upgrade-cost">$1000000</span><span class="upgrade-count">x0</span></span>
            </button>
        </div>

        <div id="prestige-container" style="margin-top: 1.25rem; display: none;">
            <button id="btn-prestige" style="padding: 1rem 2rem; background: var(--accent-color); color: #000; border: none; border-radius: 1rem; font-weight: bold; cursor: pointer; width: 100%;">
                Buyout for <span id="prestige-gain">$0</span> (Bonus: x<span id="prestige-mult">1</span>)
            </button>
        </div>

        <button id="settings-toggle">⚙️ Settings</button>
    </div>

    <script>
        /** AUDIO ENGINE **/
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.sfxGain = null;
                this.musicGain = null;
                this.isInitialized = false;
            }

            init() {
                if (this.isInitialized) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();
                this.musicGain = this.ctx.createGain();

                this.sfxGain.connect(this.masterGain);
                this.musicGain.connect(this.masterGain);
                this.masterGain.connect(this.ctx.destination);

                this.sfxGain.gain.value = 0.7;
                this.musicGain.gain.value = 0.3;

                this.isInitialized = true;
                this.startMusic();
            }

            playClick() {
                if (!this.isInitialized) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.sfxGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playMoney() {
                if (!this.isInitialized) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.sfxGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playBuyout() {
                if (!this.isInitialized) return;
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    const t = this.ctx.currentTime + i * 0.12;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0.001, t);
                    gain.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                    osc.connect(gain);
                    gain.connect(this.sfxGain);
                    osc.start(t);
                    osc.stop(t + 0.5);
                });
            }

            startMusic() {
                if (!this.isInitialized) return;
                const playTone = (freq, detune, duration) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.detune.setValueAtTime(detune, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.03, this.ctx.currentTime + duration/2);
                    gain.gain.linearRampToValueAtTime(0.02, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.musicGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                };

                const loop = () => {
                    if (!this.isInitialized) return;
                    playTone(110, 0, 4);
                    playTone(115, 0, 4);
                    setTimeout(() => loop(), 4000);
                };
                loop();
            }

            updateVolumes(sfxVol, musicVol, soundEnabled) {
                if (!this.isInitialized) return;
                const multiplier = soundEnabled ? 1 : 0;
                this.sfxGain.gain.setTargetAtTime(sfxVol * multiplier, this.ctx.currentTime, 0.1);
                this.musicGain.gain.setTargetAtTime(musicVol * multiplier, this.ctx.currentTime, 0.1);
            }
        }

        const sounds = new SoundManager();

        function haptic(style) {
            try {
                if (window.webkit && webkit.vibrate) {
                    webkit.vibrate('haptics', { impactStyle: style || 'medium' });
                } else if (navigator.vibrate) {
                    navigator.vibrate(style === 'heavy' ? 50 : 25);
                }
            } catch (e) {}
        }

        function hapticBuyout() {
            try {
                if (window.webkit && webkit.vibrate) {
                    webkit.vibrate('notification', { notificationType: 'success' });
                } else if (navigator.vibrate) {
                    navigator.vibrate([60, 40, 90]);
                }
            } catch (e) {}
        }

        let state = {
            money: 0,
            mpc: 1,
            mps: 0,
            upgradesOwned: {
                'training': 0,
                'worker': 0,
                'manager': 0,
                'bank': 0,
                'real_estate': 0,
                'hedge_fund': 0,
                'monopoly': 0
            },
            prestigeLevel: 0,
            prestigeMultiplier: 1,
            isSaleActive: false,
            saleDiscount: 0.5,
            saleTimeRemaining: 0
        };

        const upgrades = [
            { id: 'training', baseCost: 15, type: 'mpc', value: 1 },
            { id: 'worker', baseCost: 100, type: 'mps', value: 1 },
            { id: 'manager', baseCost: 500, type: 'mps', value: 5 },
            { id: 'bank', baseCost: 2500, type: 'mps', value: 25 },
            { id: 'real_estate', baseCost: 15000, type: 'mps', value: 100 },
            { id: 'hedge_fund', baseCost: 100000, type: 'mps', value: 500 },
            { id: 'monopoly', baseCost: 1000000, type: 'mps', value: 5000 }
        ];

        const moneyEl = document.getElementById('money');
        const mpsEl = document.getElementById('mps-display');
        const mpcEl = document.getElementById('mpc-display');
        const moneyIconEl = document.getElementById('money-icon');
        const saleBanner = document.getElementById('sale-banner');
        const saleTimerEl = document.getElementById('sale-timer');
        const prestigeContainer = document.getElementById('prestige-container');
        const btnPrestige = document.getElementById('btn-prestige');
        const prestigeGainEl = document.getElementById('prestige-gain');
        const prestigeMultEl = document.getElementById('prestige-mult');
        const prestigeMultDisplayEl = document.getElementById('prestige-mult-display');

        function getEffectiveCost(upg) {
            const baseCost = upg.baseCost * Math.pow(1.2, state.upgradesOwned[upg.id]);
            return state.isSaleActive ? Math.floor(baseCost * state.saleDiscount) : Math.floor(baseCost);
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = `+$${text}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function getPrestigeGain() {
            return Math.floor(Math.sqrt(state.money / 10000));
        }

        function updateUI() {
            moneyEl.textContent = Math.floor(state.money).toLocaleString();
            mpsEl.textContent = (state.mps * state.prestigeMultiplier).toFixed(1);
            mpcEl.textContent = (state.mpc * state.prestigeMultiplier).toFixed(1);

            const gain = getPrestigeGain();
            if (gain >= 1) {
                prestigeContainer.style.display = 'block';
                prestigeGainEl.textContent = gain.toLocaleString();
                prestigeMultEl.textContent = (state.prestigeMultiplier + gain).toFixed(1);
            } else {
                prestigeContainer.style.display = 'none';
            }
            prestigeMultDisplayEl.textContent = `x${state.prestigeMultiplier.toFixed(1)}`;

            upgrades.forEach(upg => {
                const btn = document.getElementById(`upgrade-${upg.id}`);
                const costSpan = btn.querySelector('.upgrade-cost');
                const countSpan = btn.querySelector('.upgrade-count');
                const cost = getEffectiveCost(upg);
                const owned = state.upgradesOwned[upg.id];

                costSpan.textContent = `$${cost.toLocaleString()}`;

                if (state.isSaleActive) {
                    costSpan.classList.add('sale-text');
                } else {
                    costSpan.classList.remove('sale-text');
                }

                if (owned > 0) {
                    countSpan.textContent = `x${owned}`;
                    countSpan.style.display = 'inline-block';
                } else {
                    countSpan.style.display = 'none';
                }

                btn.disabled = state.money < cost;
            });

            if (state.isSaleActive) {
                saleBanner.style.display = 'block';
                saleTimerEl.textContent = state.saleTimeRemaining;
            } else {
                saleBanner.style.display = 'none';
            }
        }

        moneyIconEl.addEventListener('click', (e) => {
            const effectiveMpc = state.mpc * state.prestigeMultiplier;
            state.money += effectiveMpc;
            createFloatingText(e.clientX, e.clientY, Math.floor(effectiveMpc));
            sounds.playClick();
            haptic('heavy');
            updateUI();
        });

        upgrades.forEach(upg => {
            const btn = document.getElementById(`upgrade-${upg.id}`);
            btn.addEventListener('click', () => {
                const cost = getEffectiveCost(upg);
                if (state.money >= cost) {
                    state.money -= cost;
                    state.upgradesOwned[upg.id]++;
                    
                    if (upg.type === 'mpc') {
                        state.mpc += upg.value;
                    } else {
                        state.mps += upg.value;
                    }
                    sounds.playMoney();
                    haptic('medium');
                    updateUI();
                }
            });
        });

        setInterval(() => {
            if (state.mps > 0) {
                state.money += (state.mps * state.prestigeMultiplier) / 10;
                updateUI();
            }
        }, 100);

        function triggerBuyout() {
            const gain = getPrestigeGain();
            if (gain < 1) return;
            if (!confirm(`Buy out and reset for +${gain} bonus? (New multiplier: x${(state.prestigeMultiplier + gain).toFixed(1)})`)) return;

            state.money = 0;
            state.mpc = 1;
            state.mps = 0;
            state.prestigeLevel++;
            state.prestigeMultiplier += gain;
            for (const key in state.upgradesOwned) {
                state.upgradesOwned[key] = 0;
            }
            sounds.playBuyout();
            hapticBuyout();
            updateUI();
        }

        btnPrestige.addEventListener('click', triggerBuyout);

        function triggerSale() {
            if (state.isSaleActive) return;
            state.isSaleActive = true;
            state.saleTimeRemaining = 15;
            updateUI();

            const saleTimer = setInterval(() => {
                state.saleTimeRemaining--;
                if (state.saleTimeRemaining <= 0) {
                    clearInterval(saleTimer);
                    state.isSaleActive = false;
                    updateUI();
                } else {
                    updateUI();
                }
            }, 1000);
        }

        function scheduleNextSale() {
            const nextSaleIn = Math.floor(Math.random() * 30) + 20;
            setTimeout(() => {
                triggerSale();
                scheduleNextSale();
            }, nextSaleIn * 1000);
        }

        scheduleNextSale();

        // UI elements for settings
        const settingsBtn = document.getElementById('settings-toggle');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('close-settings');
        const soundToggle = document.getElementById('sound-toggle');
        const musicVolSlider = document.getElementById('music-volume');
        const sfxVolSlider = document.getElementById('sfx-volume');

        // Settings Logic
        settingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        function updateSoundSettings() {
            sounds.updateVolumes(
                parseFloat(sfxVolSlider.value),
                parseFloat(musicVolSlider.value),
                soundToggle.checked
            );
        }

        soundToggle.addEventListener('change', updateSoundSettings);
        musicVolSlider.addEventListener('input', updateSoundSettings);
        sfxVolSlider.addEventListener('input', updateSoundSettings);

        // Initialize Audio on first click
        document.addEventListener('click', () => {
            if (!sounds.isInitialized) {
                sounds.init();
            }
        }, { once: true });

        updateUI();
    </script>
</body>
</html>
