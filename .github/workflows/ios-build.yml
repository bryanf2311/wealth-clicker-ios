name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ad-hoc signed IPA (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned app for iPhoneOS
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then echo "Workspace not found!"; exit 1; fi
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Locate built .app
        id: locate_app
        run: |
          set -euo pipefail
          APP=$(find build/derived -type d -name "App.app" -path '*Release-iphoneos*' | head -n 1)
          if [ -z "$APP" ]; then echo "App.app not found"; ls -R build/derived; exit 1; fi
          echo "APP=$APP" >> "$GITHUB_OUTPUT"
          echo "Found app at: $APP"

      - name: Ad-hoc sign + assemble IPA
        env:
          APP_PATH: ${{ steps.locate_app.outputs.APP }}
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          codesign --force --sign - --deep --timestamp=none Payload/App.app
          zip -r wealth-clicker.ipa Payload
          ls -lh wealth-clicker.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-clicker-ipa
          path: wealth-clicker.ipa
          if-no-files-found: error
          retention-days: 14
